name: Checks

permissions:
  contents: 'write'

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # if you want to cancel runs when a new one is queued, set this to true
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Enable debug logging for actions
  ACTIONS_RUNNER_DEBUG: true
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  checks:
    if: ${{ !contains(github.event.head_commit.message, '[skip-checks]') }}
    runs-on: ['ubuntu-latest']
    steps:
      - name: 🔑 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: '📦 Install Dependencies'
        uses: ./.github/actions/install-dependencies
        with:
          frozen-lockfile: true
          registry-url: 'https://registry.npmjs.org'

      - name: '🧹 Format'
        shell: bash
        run: pnpm oxfmt --config='oxfmt.config.ts' --check

      - name: '🧹 Lint'
        shell: bash
        run: pnpm oxlint --config='oxlint.config.ts' --max-warnings=0 --format='github' --report-unused-disable-directives

      - name: '🧪 Typecheck'
        shell: bash
        run: pnpm tsgo --project 'tsconfig.json' --noEmit

      - name: '🔧 Build'
        shell: bash
        run: pnpm tsdown --config='tsdown.config.ts'

      - name: '🧪 Test'
        shell: bash
        run: pnpm vitest --run --reporter='github-actions'
